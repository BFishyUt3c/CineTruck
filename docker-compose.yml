version: "3.9"

services:
  # ═══════════════════════════════════════════════════════════════
  # MS1 - USUARIOS (FastAPI + PostgreSQL)
  # ═══════════════════════════════════════════════════════════════
  ms1:
    build:
      context: ./Microservicio1_usuario
      dockerfile: Dockerfile
    container_name: ms1
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://root:password@ms1-db:5432/usuarios_db
    depends_on:
      ms1-db:
        condition: service_healthy
    networks:
      - cloud-net
    restart: unless-stopped

  ms1-db:
    image: postgres:15
    container_name: ms1-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - ms1-db-data:/var/lib/postgresql/data
    networks:
      - cloud-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # MS2 - PELÍCULAS (Node.js + MySQL)
  # ═══════════════════════════════════════════════════════════════
  ms2:
    build:
      context: ./Microservicio2-Peliculas-REPO
      dockerfile: Dockerfile
    container_name: ms2
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=ms2-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=movies_db
      - PORT=3000
    depends_on:
      ms2-db:
        condition: service_healthy
    networks:
      - cloud-net
    restart: unless-stopped

  ms2-db:
    image: mysql:8
    container_name: ms2-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movies_db
    ports:
      - "3306:3306"
    volumes:
      - ms2-db-data:/var/lib/mysql
    networks:
      - cloud-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # MS3 - FORO (Spring Boot + MongoDB)
  # ═══════════════════════════════════════════════════════════════
  ms3:
    build:
      context: ./Microservicio3-Foro
      dockerfile: Dockerfile
    container_name: ms3
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://ms3-db:27017/forum_db
      - SERVER_PORT=8080
    depends_on:
      - ms3-db
    networks:
      - cloud-net
    restart: unless-stopped

  ms3-db:
    image: mongo:7.0
    container_name: ms3-db
    ports:
      - "27017:27017"
    volumes:
      - ms3-db-data:/data/db
    networks:
      - cloud-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # MS4 - ORQUESTADOR
  # Flujo: Frontend → MS4 → MS1/MS2/MS3
  # ═══════════════════════════════════════════════════════════════
  ms4:
    build:
      context: ./Microservicio4
      dockerfile: Dockerfile
    container_name: ms4
    ports:
      - "8004:8004"
    environment:
      - MS1_URL=http://ms1:8000
      - MS2_URL=http://ms2:3000
      - MS3_URL=http://ms3:8080
      - PORT=8004
    depends_on:
      - ms1
      - ms2
      - ms3
    networks:
      - cloud-net
    restart: unless-stopped

volumes:
  ms1-db-data:
  ms2-db-data:
  ms3-db-data:

networks:
  cloud-net:
    driver: bridge
